name: Build YOW image

# Builds the server container and pushes it to GHCR so any Docker host can pull
# it. Runs on pushes to main (and manual dispatch); the job is guarded to the
# upstream repo so forks never publish an image.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "connectors/**"
      - "package.json"
      - "package-lock.json"
      - "docker/**"
      - ".github/workflows/yow-image.yml"
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    # Auto-build only on the upstream repo; a manual dispatch may run anywhere
    # (e.g. to build a fork's own image), so forks never auto-build on sync.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'TomAnthony/YourOwnWeigh'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner for image name
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/yourownweigh:latest
            ghcr.io/${{ steps.owner.outputs.name }}/yourownweigh:${{ github.sha }}
