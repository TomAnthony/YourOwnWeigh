[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yow-bridge"
version = "0.4.10"
description = "Local Bluetooth and firmware bridge for YourOwnWeigh"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "bleak>=1.0,<3", "websockets>=15,<17",
    "pyobjc-framework-IOBluetooth>=11,<13; sys_platform == 'darwin'",
    "dbus-fast>=2.24,<6; sys_platform == 'linux'",
    "winrt-Windows.Devices.Bluetooth>=4!0,<5!0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=4!0,<5!0; sys_platform == 'win32'",
    "winrt-Windows.Devices.Enumeration>=4!0,<5!0; sys_platform == 'win32'",
]

[project.scripts]
yow-bridge = "yow_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yow_bridge = ["firmware/recipes/*.json"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
